[project]
name = "intentlock-graph"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "networkx>=3.3",
]

[project.optional-dependencies]
neo4j = [
    "neo4j>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["intentlock_graph"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "sqlalchemy>=2",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
]
