[project]
name = "intentlock"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2",
    "cryptography>=42",
    "httpx>=0.27",
    "openai>=1.30",
    "typesafe-sdk>=0.1",
    "paypal-server-sdk>=0.5",
    "networkx>=3.3",
    "python-ulid>=2",
    "intentlock-graph",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.15.0",
    "render==1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "responses>=0.25",
    "respx>=0.21",
]

[tool.uv.sources]
intentlock-graph = { path = "../../packages/graph", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "llm: live LLM calls (Jev/Groq); run with -m llm",
    "payments: payment edge-case tests (mock PayPal); run with -m payments",
    "sandbox: live PayPal Sandbox calls; run with RUN_SANDBOX=1",
    "security: end-to-end adversarial tests (mock PayPal, mock Jev/LLM); run with -m security",
    "real_catalog_check: checkout re-reads lines through app.product_truth (Channel3 faked per test)",
]
